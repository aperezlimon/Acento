    <style>
      :root {
        --color-ink: #111111;
        --color-paper: #f2ece0;
        --color-accent: #f2c230;
        --font-display: "Archivo Black";
        --font-label: "Oswald";
        --font-body: "EB Garamond";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--color-ink); }
      #root { position: relative; width: 100%; height: 100%; background: var(--color-ink); }
      .scene { position: absolute; inset: 0; z-index: 1; }
      #captions { position: absolute; inset: 0; z-index: 5; }

      /* Shared editorial pieces, used by every scene. */
      .pic { position: absolute; overflow: hidden; background: #1c1915; }
      .pic img { position: absolute; display: block; }
      .kicker { position: absolute; font: 600 34px/1 var(--font-label); letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent); white-space: nowrap; }
      .head { position: absolute; font: 400 92px/1.04 var(--font-display); letter-spacing: -0.015em; color: var(--color-paper); }
      .mk { position: relative; display: inline-block; padding: 0 10px; margin: 0 -10px; }
      .mk-bar { position: absolute; left: 0; right: 0; top: 14%; bottom: 4%; background: var(--color-accent); z-index: 0; }
      .mk-t { position: relative; z-index: 1; }
      .tag { position: absolute; font: 600 36px/1 var(--font-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-ink); background: var(--color-accent); padding: 12px 18px 10px; white-space: nowrap; }
      .credit { position: absolute; font: italic 500 29px/1.2 var(--font-body); color: rgba(242, 236, 224, 0.82); white-space: nowrap; }
      .box { position: absolute; background: var(--color-ink); }
      .print { position: absolute; background: var(--color-paper); padding: 18px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
      .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
