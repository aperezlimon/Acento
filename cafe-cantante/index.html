      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-400i.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      /* Acento tokens (brand book v1, tokens.css) */
      :root {
        --acento-noche: #141110;
        --acento-cal: #f4eee6;
        --acento-rojo: #d8231a;
        --acento-albero: #d9a441;
        --acento-humo: #8c847c;
        --acento-plate: #2a2522;
        --acento-font-sans: "Instrument Sans", system-ui, sans-serif;
        --acento-font-emocion: "Instrument Serif", Georgia, serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--acento-noche); }
      #root { position: relative; width: 100%; height: 100%; background: var(--acento-noche); font-family: var(--acento-font-sans); color: var(--acento-cal); }
      .scene { position: absolute; inset: 0; z-index: 1; }
      #chrome { position: absolute; inset: 0; z-index: 3; }
      #wipes { position: absolute; inset: 0; z-index: 4; }
      #captions { position: absolute; inset: 0; z-index: 5; }

      /* Shared brand pieces */
      .flash { position: absolute; inset: 0; background: var(--acento-rojo); opacity: 0; }
      .card { position: absolute; border-radius: 28px; overflow: hidden; }
      .card .rv { position: absolute; inset: 0; }
      .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      .cut23 { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 128px), calc(100% - 300px) 100%, 0 100%); }
      .sans { font-family: var(--acento-font-sans); font-weight: 600; letter-spacing: -0.035em; line-height: 1.02; color: var(--acento-cal); }
      .emo { font-family: var(--acento-font-emocion); font-style: italic; font-weight: 400; letter-spacing: -0.01em; line-height: 1.0; }
      .red { color: var(--acento-rojo); }
      .alb { color: var(--acento-albero); }
      .humo { color: var(--acento-humo); }
      .pill { position: absolute; font: 600 32px/1 var(--acento-font-sans); color: var(--acento-cal); background: var(--acento-plate); padding: 14px 26px 13px; border-radius: 999px; white-space: nowrap; }
      .pills { position: absolute; display: flex; gap: 14px; }
      .pills .pill { position: relative; }
      .lbl { font: 600 28px/1 var(--acento-font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--acento-humo); white-space: nowrap; }
      .credit { position: absolute; font: 500 26px/1.2 var(--acento-font-sans); color: var(--acento-humo); white-space: nowrap; }
      /* Huella rítmica: 12 beats, accents on 3 6 8 10 12 */
      .huella { position: absolute; display: flex; align-items: flex-end; gap: 22px; height: 70px; }
      .hb { position: relative; display: block; }
      .hb.t { width: 6px; height: 30px; border-radius: 3px; background: var(--acento-humo); }
      .hb.acc svg { width: 44px; height: 62px; display: block; overflow: visible; }
    </style>
