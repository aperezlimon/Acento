<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Papel de estraza","default":"#C9A77C"},
    {"id":"color-news","type":"color","label":"Papel de periódico","default":"#E6DCC3"},
    {"id":"color-ink","type":"color","label":"Tinta","default":"#1B1712"},
    {"id":"color-accent","type":"color","label":"Rojo albero","default":"#B8432F"},
    {"id":"font-display","type":"string","label":"Titulares","default":"League Gothic"},
    {"id":"font-body","type":"string","label":"Texto","default":"EB Garamond"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Calle Rosario, 4</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/collage.js"></script>
    <style>
      :root {
        --color-ground: #c9a77c;
        --color-news: #e6dcc3;
        --color-ink: #1b1712;
        --color-accent: #b8432f;
        --font-display: "League Gothic";
        --font-body: "EB Garamond";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--color-ground);
      }
      /* Kraft fibre: a static paper texture under every scene. */
      #ground {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-color: var(--color-ground);
        background-image: url("assets/paper/kraft-fibre.png");
        background-size: 540px 540px;
      }
      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      /* Shared collage pieces, used by every scene. */
      .card { position: absolute; filter: drop-shadow(0 6px 0 rgba(27, 23, 18, 0.35)); }
      .sheet { position: absolute; inset: 0; background: var(--color-news) url("assets/paper/newsprint.png"); background-size: 540px 540px; }
      .photo { position: absolute; inset: 22px; width: calc(100% - 44px); height: calc(100% - 44px); object-fit: cover; }
      .tape { position: absolute; background: rgba(242, 230, 196, 0.72); }
      .hl { position: relative; font-family: var(--font-display); font-weight: 400; line-height: 0.92; letter-spacing: 0.01em; color: var(--color-ink); white-space: nowrap; }
      .tx { position: relative; font-family: var(--font-body); font-weight: 600; color: var(--color-ink); white-space: nowrap; }
      .red { color: var(--color-accent); }
      #captions {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="81.884"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground" class="clip" data-start="0" data-duration="81.884" data-track-index="0"></div>

      <div id="s1" class="scene" data-composition-id="s1" data-composition-src="compositions/s1-boleto.html" data-start="0.0" data-duration="3.469" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2" class="scene" data-composition-id="s2" data-composition-src="compositions/s2-puerta-cerrada.html" data-start="3.469" data-duration="7.92" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3" class="scene" data-composition-id="s3" data-composition-src="compositions/s3-cafe.html" data-start="11.389" data-duration="10.723" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4" class="scene" data-composition-id="s4" data-composition-src="compositions/s4-silverio.html" data-start="22.112" data-duration="9.51" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5" class="scene" data-composition-id="s5" data-composition-src="compositions/s5-italia-moron.html" data-start="31.622" data-duration="12.766" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6" class="scene" data-composition-id="s6" data-composition-src="compositions/s6-chacon.html" data-start="44.388" data-duration="8.119" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s7" class="scene" data-composition-id="s7" data-composition-src="compositions/s7-edad-de-oro.html" data-start="52.507" data-duration="9.325" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s8" class="scene" data-composition-id="s8" data-composition-src="compositions/s8-silla.html" data-start="61.832" data-duration="11.854" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s9" class="scene" data-composition-id="s9" data-composition-src="compositions/s9-cierre.html" data-start="73.686" data-duration="8.198" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="81.884" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <audio id="voz" src="assets/audio/narration.wav" data-start="0" data-duration="81.884" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
